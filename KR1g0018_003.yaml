front:
  text: 經典稽疑後語漢石經遺字者藏洛陽及長安人家蓋靈帝熹平四年所立其字則蔡雍小字八分書也其後屢經遷徙故散落不存今所有者本數千字皆土壤埋沒之餘摩滅而僅存者爾據本傳稱雍以經籍去聖久逺文字多謬俗儒穿鑿疑誤後學乃奏求正定六經文字自書册於碑於是後儒晚學咸取正焉今石本既已摩滅而嵗久轉寫日就訛舛以世所傳經書本校此遺字其不同者已數百言又篇第亦時有小異使完本具存則其異同豈勝數耶而後世學者於去古數千百嵗之後盡絀前代諸儒之論欲以已之私意悉通其說難矣趙明誠金石録宦者汝陽李巡以為諸博士試甲乙科爭第髙下更相告言至有行賂定蘭臺漆書經字以合其私文者乃白帝與諸儒共刻五經文於石於是詔蔡雍等正其文字自後五經一定爭者用息後漢書夫石經之前行賂定字石經之後遷徙散落則私意求通信如德甫之說故余不嫌固陋僭輯數條如右且巡白靈帝使伯喈得行求正之志其有功經學誠足多也因併識之丁亥夏五陳耀文書
