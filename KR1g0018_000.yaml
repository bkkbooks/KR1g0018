body:
  text: 經典稽疑五經總義類提要臣等謹按經典稽疑二卷明陳耀文撰耀文字晦伯確山人萬厯庚戌進士官至按察使副使此書取漢唐以來說經之異於宋儒者分條輯載上卷為四書下卷為易書詩春秋禮記周禮先儒專門之學各有師承非同臆說耀文欲存諸經古訓但當採鄭王賈孔遺言不應雜以明人議論又如宰豫晝寢但取七經小傳寢為內寢之說而不引資暇集所載梁武帝繪晝寢室一條竊比老彭但取經典釋文所引鄭云老老𣆀彭彭祖之說而不引禮記疏文選注所載鄭注老𣆀周之太史彭彭咸也一條乾元亨利貞但取子夏傳始通和正之說而不引義海撮要所載梁武帝義始為元遂為亨益為利不私為貞一條此類頗多亦傷漏略又如周禮備載宋元諸儒攻駁之語則徒啓紛紜孟子備載筆談所紀王聖美因何却見梁惠王之言則更涉諧謔蓋耀文因當時帖括之士墨守方隅稍為裒集異同以存古義而不必一一悉從其朔故所採亦未盡精純然嘉隆之間心學盛而經學衰耀文獨能逺討遐搜潛心訓詁亦可云空谷之足音矣乾隆四十六年二月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀經典稽疑原序余幼業專經竊於餘經有志焉若未逮也入官多暇優遊典籍之場凡其不詭於經有禆於傳者咸筆識之久之遂成此編得魚忘筌誠知遺誚然師承各異見以人殊亦起豫之志也貽之同好庶裁其狂斐云萬厯丁丑仲春之吉汝南陳耀文書於藝蘇山舍
